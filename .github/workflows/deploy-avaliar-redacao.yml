name: Deploy avaliador de redação

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - supabase/functions/**
      - .github/workflows/deploy-avaliar-redacao.yml

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Publicar função e segredo
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$GEMINI_API_KEY" ]; then
            echo "Sem secrets ainda. No GitHub: Settings → Secrets → GEMINI_API_KEY e SUPABASE_ACCESS_TOKEN. Depois roda este workflow."
            exit 0
          fi
          supabase functions deploy avaliar-redacao --project-ref yjdffoswgfskpocrupul
          printf '%s' "$GEMINI_API_KEY" | supabase secrets set GEMINI_API_KEY --project-ref yjdffoswgfskpocrupul --stdin
