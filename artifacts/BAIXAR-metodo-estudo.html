<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Baixar método de estudo — CNAPROVADO</title>
  <style>
    :root {
      --ink: #1a1f2e;
      --muted: #5c6578;
      --accent: #0d6e6e;
      --soft: #e8f3f3;
      --bg: #f4f7f7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Plus Jakarta Sans", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 20% 20%, #d7efef 0%, transparent 45%),
        radial-gradient(circle at 80% 0%, #cfe4e4 0%, transparent 40%),
        var(--bg);
      color: var(--ink);
      padding: 24px;
    }
    .card {
      width: min(440px, 100%);
      background: #fff;
      border: 1px solid #c5d4d4;
      border-radius: 18px;
      padding: 28px 24px;
      box-shadow: 0 12px 40px rgba(13, 110, 110, 0.08);
      text-align: center;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.35rem;
      letter-spacing: -0.02em;
    }
    p {
      margin: 0 0 22px;
      color: var(--muted);
      line-height: 1.45;
      font-size: 0.95rem;
    }
    button, a.btn {
      appearance: none;
      border: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      font-size: 1rem;
      text-decoration: none;
      cursor: pointer;
    }
    button:active { transform: scale(0.99); }
    .hint {
      margin-top: 14px;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .ok {
      display: none;
      margin-top: 14px;
      padding: 10px;
      border-radius: 10px;
      background: var(--soft);
      color: var(--accent);
      font-weight: 600;
      font-size: 0.9rem;
    }
    .ok.show { display: block; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Método de Estudo Rápido</h1>
    <p>Clique no botão abaixo para baixar o PDF (2 páginas) no seu celular ou computador.</p>
    <button id="btn" type="button">Baixar PDF agora</button>
    <div class="ok" id="ok">Download iniciado. Se não abriu, olhe a pasta Downloads.</div>
    <p class="hint">Arquivo: metodo-estudo-rapido.pdf</p>

    function b64ToBlob(b64, type) {
      const bin = atob(b64);
      const len = bin.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
      return new Blob([bytes], { type });
    }
    function download() {
      const blob = b64ToBlob(B64, "application/pdf");
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "metodo-estudo-rapido.pdf";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1500);
      document.getElementById("ok").classList.add("show");
    }
    document.getElementById("btn").addEventListener("click", download);
    // tenta baixar automaticamente na abertura
    setTimeout(download, 400);
